---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: insurance_policy
  version: default

  rules:
    # ── Rule 1: insurance_agent — read/list/aggregate own policies only ────────
    # ABAC baseline: both tenant_id AND agent_id must match the principal.
    # planResources returns KIND_CONDITIONAL with two eq() clauses compiled to:
    #   { $and: [{ tenant_id: "<P.attr.tenant_id>" }, { agent_id: "<P.id>" }] }
    # Any action not listed here is implicitly DENIED by Cerbos default-deny.
    - name: agent_own_policies
      actions:
        - read
        - list
        - aggregate
      effect: EFFECT_ALLOW
      roles:
        - insurance_agent
      condition:
        match:
          all:
            of:
              - expr: R.attr.tenant_id == P.attr.tenant_id
              - expr: R.attr.agent_id == P.id

    # ── Rule 2: tenant_admin — read/list/aggregate any policy in their tenant ──
    # Elevated read scope: only tenant_id is checked, agent_id is NOT enforced.
    # planResources returns KIND_CONDITIONAL with a single eq() clause compiled to:
    #   { tenant_id: "<P.attr.tenant_id>" }
    # The admin for Tenant_A sees ALL Tenant_A policies across every agent,
    # but ZERO Tenant_B policies (the tenant boundary is still hard-enforced).
    - name: admin_tenant_read
      actions:
        - read
        - list
        - aggregate
      effect: EFFECT_ALLOW
      roles:
        - tenant_admin
      condition:
        match:
          expr: R.attr.tenant_id == P.attr.tenant_id

    # ── Rule 3: customer — read only their own policies ───────────────────────
    # The Cerbos principal for a customer uses:
    #   P.id               = clientId slug (e.g. "alice-johnson")
    #   P.attr.client_name = "Alice Johnson"  ← matched against R.attr.client_name
    #   P.attr.tenant_id   = "Tenant_A"       ← matched against R.attr.tenant_id
    #
    # planResources compiles this to:
    #   { $and: [{ tenant_id: "Tenant_A" }, { client_name: "Alice Johnson" }] }
    # which is injected into every MCP tool call — structurally preventing any
    # customer from seeing another customer's policy, even in the same tenant.
    - name: customer_own_policies
      actions:
        - read
        - list
      effect: EFFECT_ALLOW
      roles:
        - customer
      condition:
        match:
          all:
            of:
              - expr: R.attr.tenant_id == P.attr.tenant_id
              - expr: R.attr.client_name == P.attr.client_name

    # ── Rule 4 [COMMENTED — sample write rule for tenant_admin] ───────────────
    # - name: admin_write_own_tenant
    #   actions:
    #     - update
    #   effect: EFFECT_ALLOW
    #   roles:
    #     - tenant_admin
    #   condition:
    #     match:
    #       all:
    #         of:
    #           - expr: R.attr.tenant_id == P.attr.tenant_id

    # ── NOTE: No explicit deny rule needed ────────────────────────────────────
    # Cerbos operates on default-deny: any action not covered by an EFFECT_ALLOW
    # rule above is automatically KIND_ALWAYS_DENIED.
